name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Regenerates src/convex/_generated locally (no deployment connection
      # needed) so `tsc -b` can typecheck the Convex code. Committed copies
      # also exist, so this is a safety net.
      - name: Generate Convex client types
        run: bunx convex codegen
        continue-on-error: true

      # GitHub Pages serves project sites under /<repo-name>/ — build with a
      # matching base so assets, images and the router all resolve.
      - name: Determine base path
        id: base
        run: echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bun run build -- --base="${{ steps.base.outputs.path }}"

      # SPA fallback: unknown paths serve the app instead of GitHub's 404.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
